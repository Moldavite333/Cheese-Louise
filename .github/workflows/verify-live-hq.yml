name: Verify live Cocktail draft cleanup
on: pull_request
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check deployed page and workflow assets
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {setTimeout: wait} = require('node:timers/promises');
          const base = 'https://moldavite333.github.io/Cheese-Louise/';
          async function read(path) {
            const response = await fetch(base + path, {headers: {'Cache-Control': 'no-cache'}, signal: AbortSignal.timeout(8000)});
            assert.equal(response.status, 200);
            return response.text();
          }
          (async () => {
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const page = await read('?verify=' + Date.now());
                assert.ok(page.includes('mixology-studio.js?v=draft-cleanup-2'));
                const js = await read('mixology-studio.js?v=draft-cleanup-2');
                assert.ok(js.includes('mixology_discard_draft'));
                assert.ok(js.includes('and its workshop and research'));
                console.log('Live HQ serves intentional recipe creation and draft deletion.');
                return;
              } catch (error) {
                if (attempt === 11) throw error;
                console.log('Waiting for the new assets: ' + error.message);
                await wait(5000);
              }
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
