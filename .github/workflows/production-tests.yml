name: HQ red-team regression checks
on:
  push:
    branches: [main, design/hq-production-redteam]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Test production and filtering logic with isolated fixture data
        run: node --test tests/*.test.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check the assembled HQ interface using mocked authentication and data
        run: node scripts/hq-browser-smoke.mjs
      - name: Check cocktail ranking, details and fresh variations on mobile and desktop
        run: node scripts/cocktail-browser-smoke.mjs
      - name: Check original Grit songwriting in real browsers
        run: node scripts/grit-browser-smoke.mjs
      - name: Check deployed songwriting readiness and authentication
        run: node scripts/grit-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hq-interface-screenshots
          path: artifacts/
          if-no-files-found: ignore

