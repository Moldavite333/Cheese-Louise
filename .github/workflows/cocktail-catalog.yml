name: Build the broad cocktail matching catalog
on:
  push:
    branches: [fix/expanded-cocktail-catalog]
    paths:
      - 'scripts/update-cocktail-catalog.mjs'
      - '.github/workflows/cocktail-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate provider bulk export
        run: node scripts/update-cocktail-catalog.mjs
      - name: Save the verified matching index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cocktail-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update verified broad cocktail matching index'
          git push
